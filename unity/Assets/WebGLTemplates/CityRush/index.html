<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>CITY RUSH — street racing in your browser</title>
  <meta name="description" content="Arcade street racing through neon downtown and sunny suburbs. Race AI or real players online, drift for nitro, top the leaderboard. Free, no download.">
  <meta name="theme-color" content="#0d0b1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="CITY RUSH — street racing in your browser">
  <meta property="og:description" content="Drift. Nitro. Win. Race real players online — free, no download.">
  <meta property="og:image" content="__SITE_URL__/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="__SITE_URL__/og.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b1a; touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #0d0b1a; outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5;
      background: radial-gradient(circle at 50% 38%, #3a1650 0%, #0d0b1a 65%); transition: opacity .5s; overflow: hidden; }
    #loader.done { opacity: 0; pointer-events: none; }
    .road { position: relative; width: 190px; height: 150px; perspective: 260px; }
    .road .asphalt { position: absolute; inset: 0; transform: rotateX(58deg); transform-origin: 50% 100%;
      background: linear-gradient(90deg, #ff3d7f 0 5%, #24203a 5% 95%, #2ee6ff 95%); border-radius: 6px; overflow: hidden; box-shadow: 0 0 40px rgba(255,61,127,.35); }
    .road .asphalt::after { content: ""; position: absolute; left: 47%; width: 6%; top: -100%; height: 300%;
      background: repeating-linear-gradient(180deg, #ffd166 0 22px, transparent 22px 48px); animation: dash .35s linear infinite; }
    @keyframes dash { to { transform: translateY(48px); } }
    .car { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); font-size: 58px; animation: wob .5s ease-in-out infinite alternate; filter: drop-shadow(0 6px 6px rgba(0,0,0,.5)); }
    @keyframes wob { to { transform: translateX(-46%) rotate(-3deg); } }
    h1 { margin: 26px 0 4px; font-size: 52px; font-weight: 900; font-style: italic; letter-spacing: 3px; text-shadow: -3px 0 #2ee6ff, 3px 0 #ff3d7f, 0 0 30px rgba(255,61,127,.5); }
    .tag { opacity: .75; font-weight: 800; letter-spacing: 3px; font-size: 13px; }
    .bar { width: 240px; height: 10px; border-radius: 10px; background: rgba(255,255,255,.14); margin-top: 28px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2ee6ff, #ff3d7f); transition: width .2s; border-radius: 10px; }
    #err { display: none; max-width: 320px; text-align: center; margin-top: 18px; font-size: 14px; opacity: .85; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div class="road"><div class="asphalt"></div><div class="car">🏎️</div></div>
    <h1>CITY RUSH</h1>
    <div class="tag">DRIFT · NITRO · WIN</div>
    <div class="bar"><i id="fill"></i></div>
    <div id="err"></div>
  </div>
  <div id="toast" style="position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#fff;color:#0d0b1a;font-weight:800;padding:12px 20px;border-radius:999px;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none"></div>
  <script>
    // ---- Portal adapter: Poki / CrazyGames if present, otherwise a dev fallback that just grants rewards.
    (function () {
      var poki = function () { return window.PokiSDK; };
      var crazy = function () { return window.CrazyGames && window.CrazyGames.SDK; };
      window.crToast = function (m) { var t = document.getElementById("toast"); t.textContent = m; t.style.opacity = 1; clearTimeout(window.__gt); window.__gt = setTimeout(function () { t.style.opacity = 0; }, 2000); };
      window.SD = {
        adsAvailable: function () { return !!(poki() || crazy()); },   // rewarded ads only where a portal SDK exists
        rewarded: function () {
          if (poki()) return poki().rewardedBreak().then(function (ok) { return !!ok; });
          if (crazy()) return new Promise(function (res) {
            crazy().ad.requestAd("rewarded", { adFinished: function () { res(true); }, adError: function () { res(false); } });
          });
          return new Promise(function (res) { setTimeout(function () { res(true); }, 400); }); // dev: instant reward
        },
        gameplay: function (on) {
          try { if (poki()) on ? poki().gameplayStart() : poki().gameplayStop(); } catch (e) {}
          try { if (crazy()) on ? crazy().game.gameplayStart() : crazy().game.gameplayStop(); } catch (e) {}
        },
        ready: function () {
          try { if (poki()) poki().gameLoadingFinished(); } catch (e) {}
          try { if (crazy()) crazy().game.loadingStop(); } catch (e) {}
        },
        track: function (name, value) {
          try { window.va && window.va("event", { name: name, data: { value: value } }); } catch (e) {}
        }
      };
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      ["gesturestart", "gesturechange", "contextmenu", "dblclick"].forEach(function (ev) {
        document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    })();

    (function () {
      var canvas = document.getElementById("unity-canvas"), loader = document.getElementById("loader");
      var fill = document.getElementById("fill"), err = document.getElementById("err");
      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        autoSyncPersistentDataPath: true,
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) { if (type === "error") { err.style.display = "block"; err.textContent = msg; } console.warn(msg); }
      };
      var s = document.createElement("script");
      s.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      s.onload = function () {
        try { window.CrazyGames && window.CrazyGames.SDK && window.CrazyGames.SDK.game.loadingStart(); } catch (e) {}
        createUnityInstance(canvas, config, function (p) { fill.style.width = Math.round(8 + p * 92) + "%"; })
          .then(function (inst) { window.unityInstance = inst; window.cityRace && window.cityRace.ready();
            document.addEventListener("visibilitychange", function () { if (document.hidden) { try { inst.SendMessage("Game", "Persist"); } catch (e) {} } });
            window.addEventListener("pagehide", function () { try { inst.SendMessage("Game", "Persist"); } catch (e) {} }); fill.style.width = "100%"; setTimeout(function () { loader.classList.add("done"); canvas.focus(); }, 300); })
          .catch(function (m) { err.style.display = "block"; err.textContent = "Couldn't start: " + m; });
      };
      document.body.appendChild(s);
    })();
  </script>
  <script src="race.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
