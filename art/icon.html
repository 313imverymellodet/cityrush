<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:512px;height:512px;overflow:hidden;background:transparent}
.bg{position:absolute;inset:0;border-radius:112px;overflow:hidden;background:linear-gradient(145deg,#FF3D7F 0%,#7a2bd0 55%,#2EE6FF 100%)}
.road{position:absolute;left:-60px;right:-60px;bottom:-40px;height:250px;background:#1d1a2e;transform:perspective(300px) rotateX(48deg);transform-origin:50% 100%}
.road::after{content:"";position:absolute;left:48%;width:4%;top:0;bottom:0;background:repeating-linear-gradient(#FFD166 0 30px,transparent 30px 60px)}
.lines{position:absolute;inset:0}
.lines i{position:absolute;height:10px;border-radius:10px;background:rgba(255,255,255,.55)}
img{position:absolute;left:6px;top:40px;width:500px;filter:drop-shadow(0 18px 16px rgba(0,0,0,.55))}
</style></head><body><div class="bg"><div class="road"></div>
<div class="lines"><i style="left:30px;top:120px;width:120px"></i><i style="left:10px;top:170px;width:80px"></i><i style="right:24px;top:140px;width:110px"></i><i style="right:40px;top:200px;width:70px"></i></div>
<img src="car.png"></div></body></html>
