<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#fff;background:#0d0b1a}
.shot{position:absolute;inset:0;background:url(shot.png) 62% 58%/128% no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,11,26,.96) 0%,rgba(13,11,26,.85) 34%,rgba(13,11,26,.15) 62%,transparent 100%)}
.txt{position:absolute;left:62px;top:52px;width:640px}
h1{margin:0;font-size:118px;line-height:.88;font-weight:900;font-style:italic;letter-spacing:2px;text-shadow:-5px 0 #2EE6FF,5px 0 #FF3D7F,0 0 40px rgba(255,61,127,.45)}
h1 span{color:#FF3D7F;text-shadow:-5px 0 #2EE6FF,0 0 40px rgba(255,61,127,.45)}
p{margin:22px 0 0;font-size:30px;font-weight:700;opacity:.92;line-height:1.3}
.chips{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.chip{font-size:20px;font-weight:900;font-style:italic;letter-spacing:1px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.cta{display:inline-block;margin-top:26px;background:#FF3D7F;color:#fff;font-weight:900;font-style:italic;font-size:30px;padding:16px 36px;border-radius:18px;box-shadow:0 7px 0 #a0184a}
</style></head><body>
<div class="shot"></div><div class="shade"></div>
<div class="txt">
  <h1>CITY<br><span>RUSH</span></h1>
  <p>Drift for nitro. Race real players online.</p>
  <div class="chips"><span class="chip">DOWNTOWN</span><span class="chip">SUBURBS</span><span class="chip">LIVE LEADERBOARDS</span></div>
  <div class="cta">PLAY FREE &#8594;</div>
</div>
</body></html>
